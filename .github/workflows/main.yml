on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy to?'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print a message
        run: echo "Hello! GitHub Actions is working!"

      - name: Print the date
        run: date

      - name: List files
        run: ls -la
