on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy to?'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
jobs:
  build:                       
    runs-on: ubuntu-latest      
    steps:
    - name: Set up Node.js version 20
    uses: actions/setup-node@v4
    with:
      node-version: '20'
    - run: node --version
