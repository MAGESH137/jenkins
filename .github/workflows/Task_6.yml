name: Build Three Stage PL One By One Passing

on:
  push:
    branches: 
      - main
  pull-request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test

  build:
    needs: test           
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run build

  deploy:
    needs: build          
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Deploying...'
